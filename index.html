<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>crashketchum · Pokémon live auf Whatnot</title>
<meta name="description" content="crashketchum: Pokémon-Karten live auf Whatnot. Hier siehst du, ob gerade ein Stream läuft, und findest alle Kanäle.">
<meta name="theme-color" content="#0d1430">
<script>
/* Alte Links auf die Steuerseite (#wheel, #obs, #buehne) weiterleiten, z. B. aus dem Lesezeichen „Wheel-Leser“ */
if (/^#(wheel|obs|buehne|fang)/.test(location.hash)) location.replace('steuerung/' + location.search + location.hash);
</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Lilita+One&family=Nunito:wght@600;800&display=swap" rel="stylesheet">
<style>
:root {
  color-scheme: dark;
  --night: #0d1430;
  --panel: #161f42;
  --panel-2: #1e2955;
  --line: #2c3a72;
  --fg: #eef1ff;
  --muted: #9aa6d6;
  --red: #ee3b4c;
  --gold: #ffc93d;
  --live: #ff3046;
  --display: 'Lilita One', 'Arial Black', Impact, system-ui, sans-serif;
}
* { box-sizing: border-box; }
html, body { margin: 0; }
body {
  min-height: 100vh; color: var(--fg); font: 600 16px/1.45 'Nunito', system-ui, sans-serif;
  background-color: var(--night);
  background-image: radial-gradient(circle at 12% 0%, rgba(238,59,76,.28), transparent 42%), radial-gradient(circle at 95% 100%, rgba(255,201,61,.12), transparent 45%), linear-gradient(170deg, #121a3c 0%, #0b1129 60%, #10173a 100%);
  background-attachment: fixed;
}
a { color: inherit; }
.wrap { max-width: 760px; margin: 0 auto; padding: 0 16px 48px; }

header { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 18px 0 8px; }
.logo { display: flex; align-items: center; gap: 10px; font-family: var(--display); font-size: 26px; letter-spacing: .5px; text-decoration: none; }
.logo svg { width: 44px; height: 44px; flex: none; transition: transform .5s cubic-bezier(.3,1.6,.5,1); }
.logo:hover svg { transform: rotate(-25deg); }
.logo span { color: var(--red); }
.lock { display: flex; gap: 6px; }
.lock a { font-size: 13px; color: var(--muted); text-decoration: none; padding: 6px 10px; border: 1px solid var(--line); border-radius: 999px; display: inline-flex; align-items: center; gap: 5px; }
.lock a:hover { color: var(--fg); border-color: var(--muted); }
.lock svg { width: 12px; height: 12px; }

/* Haupt-Karte: Whatnot-Stream */
.stream {
  position: relative; margin-top: 18px; border-radius: 26px; overflow: hidden;
  background: linear-gradient(160deg, var(--panel-2), var(--panel)); border: 2px solid var(--line);
  box-shadow: 0 20px 50px rgba(0,0,0,.35);
}
.stream.is-live { border-color: var(--live); box-shadow: 0 0 0 4px rgba(255,48,70,.18), 0 20px 50px rgba(0,0,0,.35); }
.stream-top { padding: 28px 26px 22px; display: grid; gap: 16px; position: relative; }
.stream-top::after { /* großer Pokéball im Hintergrund */
  content: ''; position: absolute; right: -70px; top: -70px; width: 260px; height: 260px; border-radius: 50%; opacity: .08; pointer-events: none;
  background: radial-gradient(circle, transparent 0 15%, #fff 15% 21%, transparent 21%), linear-gradient(180deg, #fff 0 46%, transparent 46% 54%, #fff 54%);
  -webkit-mask: radial-gradient(circle, #000 70%, transparent 70.5%); mask: radial-gradient(circle, #000 70%, transparent 70.5%);
}
.status { display: inline-flex; align-items: center; gap: 10px; width: max-content; padding: 8px 16px 8px 12px; border-radius: 999px; font-family: var(--display); font-size: 20px; letter-spacing: .6px; background: #2a3463; color: var(--muted); }
.status i { width: 14px; height: 14px; border-radius: 50%; background: currentColor; flex: none; }
.status.live { background: var(--live); color: #fff; }
.status.live i { background: #fff; animation: pulse 1.4s infinite; }
.status.off i { background: #6c779f; }
.status.wait i { animation: blink 1s infinite; }
@keyframes pulse { 0% { box-shadow: 0 0 0 0 rgba(255,255,255,.8); } 100% { box-shadow: 0 0 0 12px rgba(255,255,255,0); } }
@keyframes blink { 50% { opacity: .3; } }
h1 { margin: 0; font-family: var(--display); font-weight: 400; font-size: clamp(30px, 7vw, 46px); line-height: 1.05; letter-spacing: .4px; }
.sub { margin: 0; color: var(--muted); max-width: 46ch; }
.cta { display: inline-flex; align-items: center; justify-content: center; gap: 10px; width: max-content; max-width: 100%; padding: 14px 24px; border-radius: 16px; text-decoration: none; font-family: var(--display); font-size: 21px; letter-spacing: .5px; background: var(--gold); color: #1b1300; box-shadow: 0 5px 0 #b8860b; transition: transform .1s, box-shadow .1s; }
.cta:active { transform: translateY(3px); box-shadow: 0 2px 0 #b8860b; }
.cta svg { width: 22px; height: 22px; }
.is-live .cta { background: var(--live); color: #fff; box-shadow: 0 5px 0 #a5101f; }
.is-live .cta:active { box-shadow: 0 2px 0 #a5101f; }

.stats { display: grid; grid-template-columns: repeat(3, 1fr); border-top: 2px solid var(--line); background: rgba(0,0,0,.14); }
.stat { padding: 16px 12px 18px; text-align: center; }
.stat + .stat { border-left: 2px solid var(--line); }
.stat b { display: block; font-family: var(--display); font-weight: 400; font-size: clamp(24px, 6vw, 34px); line-height: 1.1; }
.stat b .star { display: inline; color: var(--gold); }
.stat span { display: block; color: var(--muted); font-size: 13px; margin-top: 2px; }
.stat small { display: block; color: var(--muted); font-size: 12px; opacity: .8; }
.note { margin: 10px 4px 0; color: var(--muted); font-size: 12.5px; min-height: 1em; }

h2 { font-family: var(--display); font-weight: 400; font-size: 24px; letter-spacing: .4px; margin: 36px 0 12px; }
.socials { display: grid; grid-template-columns: repeat(auto-fill, minmax(210px, 1fr)); gap: 12px; }
.social { display: flex; align-items: center; gap: 14px; padding: 14px 16px; border-radius: 18px; text-decoration: none; background: var(--panel); border: 2px solid var(--line); transition: transform .15s, border-color .15s; }
.social:hover { transform: translateY(-2px); border-color: var(--c, var(--muted)); }
.social .ic { width: 44px; height: 44px; border-radius: 13px; display: grid; place-items: center; background: var(--c, #333); flex: none; color: #fff; }
.social .ic svg { width: 24px; height: 24px; }
.social b { display: block; font-size: 16px; }
.social span { display: block; font-size: 13px; color: var(--muted); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.social > div { min-width: 0; }

footer { margin-top: 40px; color: var(--muted); font-size: 12.5px; text-align: center; }

@media (max-width: 520px) {
  .logo b { font-size: 22px; }
  .stream-top { padding: 22px 18px 18px; }
  .cta { width: 100%; }
  .stat { padding: 14px 6px 16px; }
}
@media (prefers-reduced-motion: reduce) { * { animation: none !important; transition: none !important; } }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <a class="logo" href="./">
      <svg viewBox="0 0 100 100" aria-hidden="true">
        <circle cx="50" cy="50" r="45" fill="#f3f4fa"/>
        <path d="M5 50a45 45 0 0 1 90 0z" fill="#ee3b4c"/>
        <path d="M20 31a32 32 0 0 1 20-14" stroke="#fff" stroke-opacity=".6" stroke-width="6" fill="none" stroke-linecap="round"/>
        <path d="M5 50h90" stroke="#15151d" stroke-width="8"/>
        <circle cx="50" cy="50" r="45" fill="none" stroke="#15151d" stroke-width="6"/>
        <circle cx="50" cy="50" r="14" fill="#f3f4fa" stroke="#15151d" stroke-width="6"/>
        <circle cx="50" cy="50" r="6" fill="#fff" stroke="#15151d" stroke-opacity=".25" stroke-width="2"/>
      </svg>
      <b>crash<span>ketchum</span></b>
    </a>
    <nav class="lock" aria-label="Bereiche mit Code">
      <a href="steuerung/" title="Nur mit Code"><svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M12 2a5 5 0 0 0-5 5v3H6a2 2 0 0 0-2 2v8a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-8a2 2 0 0 0-2-2h-1V7a5 5 0 0 0-5-5zm-3 8V7a3 3 0 0 1 6 0v3z"/></svg>Fangen</a>
      <a href="steuerung/#wheel" title="Nur mit Code"><svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M12 2a5 5 0 0 0-5 5v3H6a2 2 0 0 0-2 2v8a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-8a2 2 0 0 0-2-2h-1V7a5 5 0 0 0-5-5zm-3 8V7a3 3 0 0 1 6 0v3z"/></svg>Wheel</a>
    </nav>
  </header>

  <main>
    <section class="stream" id="stream" aria-live="polite">
      <div class="stream-top">
        <div class="status wait" id="status"><i></i><span id="statusText">Status wird geladen</span></div>
        <h1 id="headline">Pokémon live auf Whatnot</h1>
        <p class="sub" id="sub">Pokémon-Karten, Packs und Wheel mit crashketchum. Folge auf Whatnot, dann verpasst du keinen Stream.</p>
        <a class="cta" id="cta" href="https://www.whatnot.com/user/crashketchum" target="_blank" rel="noopener">
          <svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M8 5.5v13a1 1 0 0 0 1.5.86l10.5-6.5a1 1 0 0 0 0-1.72L9.5 4.64A1 1 0 0 0 8 5.5z"/></svg>
          <span id="ctaText">Zum Whatnot-Profil</span>
        </a>
      </div>
      <div class="stats">
        <div class="stat"><b id="sFollowers">–</b><span>Follower</span></div>
        <div class="stat"><b id="sRating">–</b><span>Bewertung</span><small id="sReviews"></small></div>
        <div class="stat"><b id="sSold">–</b><span>Verkäufe</span></div>
      </div>
    </section>
    <p class="note" id="note"></p>

    <h2>Hier findest du crashketchum</h2>
    <div class="socials" id="socials"></div>
  </main>

  <footer>crashketchum · Pokémon live auf Whatnot</footer>
</div>

<script>
/* ---------- Hier die Links eintragen. Leere Einträge werden nicht angezeigt. ---------- */
const WHATNOT_USER = 'crashketchum';
const SOCIALS = [
  { name: 'Whatnot', handle: '@' + WHATNOT_USER, url: 'https://www.whatnot.com/user/' + WHATNOT_USER, icon: 'whatnot', color: '#e8c400' },
  { name: 'Instagram', handle: '', url: '', icon: 'instagram', color: 'linear-gradient(45deg,#f9a33a,#e1306c 50%,#833ab4)' },
  { name: 'TikTok', handle: '', url: '', icon: 'tiktok', color: '#111' },
  { name: 'YouTube', handle: '', url: '', icon: 'youtube', color: '#ff0033' },
  { name: 'Twitch', handle: '', url: '', icon: 'twitch', color: '#9146ff' },
  { name: 'Discord', handle: '', url: '', icon: 'discord', color: '#5865f2' },
  { name: 'X', handle: '', url: '', icon: 'x', color: '#000' }
];

const ICONS = {
  whatnot: '<svg viewBox="0 0 24 24" fill="currentColor"><path d="M2 6h3.2l2.3 8.2L10 6h4l2.5 8.2L18.8 6H22l-4 12h-3.3L12 9.6 9.3 18H6z"/></svg>',
  instagram: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><rect x="3" y="3" width="18" height="18" rx="5"/><circle cx="12" cy="12" r="4.2"/><circle cx="17.4" cy="6.6" r="1" fill="currentColor" stroke="none"/></svg>',
  tiktok: '<svg viewBox="0 0 24 24" fill="currentColor"><path d="M16.5 3c.4 2.3 1.9 3.8 4.2 4v3.1c-1.6 0-3-.5-4.2-1.3v6.4A5.8 5.8 0 1 1 10.7 9.4v3.2a2.7 2.7 0 1 0 2.6 2.7V3z"/></svg>',
  youtube: '<svg viewBox="0 0 24 24" fill="currentColor"><path d="M22 8.2c-.2-1.6-1-2.7-2.6-2.9C17 5 12 5 12 5s-5 0-7.4.3C3 5.5 2.2 6.6 2 8.2 1.8 9.5 1.8 12 1.8 12s0 2.5.2 3.8c.2 1.6 1 2.7 2.6 2.9C7 19 12 19 12 19s5 0 7.4-.3c1.6-.2 2.4-1.3 2.6-2.9.2-1.3.2-3.8.2-3.8s0-2.5-.2-3.8zM10 15.2V8.8l5.5 3.2z"/></svg>',
  twitch: '<svg viewBox="0 0 24 24" fill="currentColor"><path d="M4.3 2 3 5.5V20h4.8v2.5h2.7l2.5-2.5h3.9l5.1-5.1V2zm15 11.8-3 3h-4.8l-2.5 2.5v-2.5H5V3.8h14.3zM16.4 7v5.3h-1.8V7zm-4.8 0v5.3H9.8V7z"/></svg>',
  discord: '<svg viewBox="0 0 24 24" fill="currentColor"><path d="M19.3 5.3A17 17 0 0 0 15 4l-.5 1.1a15.6 15.6 0 0 0-5 0L9 4a17 17 0 0 0-4.3 1.3C2 9.4 1.3 13.3 1.6 17.2A17 17 0 0 0 6.9 20l1.1-1.8c-.6-.2-1.2-.5-1.7-.9l.4-.3a12 12 0 0 0 10.6 0l.4.3c-.5.4-1.1.7-1.7.9l1.1 1.8a17 17 0 0 0 5.3-2.8c.4-4.5-.7-8.4-3.1-11.9zM8.7 14.8c-1 0-1.9-1-1.9-2.2s.8-2.2 1.9-2.2 1.9 1 1.9 2.2-.8 2.2-1.9 2.2zm6.6 0c-1 0-1.9-1-1.9-2.2s.8-2.2 1.9-2.2 1.9 1 1.9 2.2-.8 2.2-1.9 2.2z"/></svg>',
  x: '<svg viewBox="0 0 24 24" fill="currentColor"><path d="M17.8 3h3.1l-6.8 7.8L22 21h-6.2l-4.9-6.4L5.3 21H2.2l7.3-8.3L2 3h6.4l4.4 5.8zm-1.1 16.2h1.7L7.4 4.7H5.6z"/></svg>',
  link: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M10 14a4.5 4.5 0 0 0 6.4 0l3-3a4.5 4.5 0 0 0-6.4-6.4l-1 1"/><path d="M14 10a4.5 4.5 0 0 0-6.4 0l-3 3a4.5 4.5 0 0 0 6.4 6.4l1-1"/></svg>'
};

const $ = (id) => document.getElementById(id);
const esc = (s) => String(s).replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const profile = 'https://www.whatnot.com/user/' + WHATNOT_USER;

$('socials').innerHTML = SOCIALS.filter((s) => s.url).map((s) =>
  `<a class="social" href="${esc(s.url)}" target="_blank" rel="noopener" style="--c:${esc(s.color)}">
    <div class="ic" style="background:${esc(s.color)}">${ICONS[s.icon] || ICONS.link}</div>
    <div><b>${esc(s.name)}</b><span>${esc(s.handle || s.url.replace(/^https?:\/\/(www\.)?/, ''))}</span></div>
  </a>`).join('');

const fmt = (n) => {
  if (n == null) return '–';
  if (n >= 1e6) return (n / 1e6).toLocaleString('de-DE', { maximumFractionDigits: 1 }) + ' Mio.';
  if (n >= 1e4) return (n / 1e3).toLocaleString('de-DE', { maximumFractionDigits: 1 }) + 'k';
  return n.toLocaleString('de-DE');
};

function show(d) {
  const st = $('status'), live = d && d.live === true;
  $('stream').classList.toggle('is-live', live);
  st.className = 'status ' + (live ? 'live' : d && d.live === false ? 'off' : 'unk');
  if (live) {
    $('statusText').textContent = 'JETZT LIVE';
    $('headline').textContent = 'crashketchum ist gerade live!';
    $('sub').textContent = 'Der Stream läuft auf Whatnot. Komm rein, sag Hallo und sichere dir deinen Spot.';
    $('ctaText').textContent = 'Jetzt zuschauen';
    $('cta').href = d.liveUrl || profile;
  } else {
    $('statusText').textContent = d && d.live === false ? 'Gerade offline' : 'Live-Status unbekannt';
    $('headline').textContent = 'Pokémon live auf Whatnot';
    $('sub').textContent = 'Gerade läuft kein Stream. Folge crashketchum auf Whatnot, dann bekommst du eine Nachricht, sobald es losgeht.';
    $('ctaText').textContent = 'Auf Whatnot folgen';
    $('cta').href = profile;
  }
  if (d) {
    $('sFollowers').textContent = fmt(d.followers);
    $('sRating').innerHTML = d.rating != null ? '<span class="star">★</span> ' + d.rating.toLocaleString('de-DE', { minimumFractionDigits: 1, maximumFractionDigits: 1 }) : '–';
    $('sReviews').textContent = d.reviews != null ? fmt(d.reviews) + ' Bewertungen' : '';
    $('sSold').textContent = fmt(d.sold);
  }
  $('note').textContent = d && d.ok ? 'Aktualisiert um ' + new Date().toLocaleTimeString('de-DE', { hour: '2-digit', minute: '2-digit' }) + ' Uhr · Daten von Whatnot'
    : 'Whatnot konnte gerade nicht abgefragt werden. Ob ein Stream läuft, siehst du direkt auf Whatnot.';
}

async function refresh() {
  try {
    const r = await fetch('/api/whatnot?u=' + encodeURIComponent(WHATNOT_USER), { cache: 'no-store' });
    if (!r.ok) throw new Error(r.status);
    show(await r.json());
  } catch (e) { show(null); }
}
refresh();
setInterval(() => { if (!document.hidden) refresh(); }, 60000);
document.addEventListener('visibilitychange', () => { if (!document.hidden) refresh(); });
</script>
</body>
</html>
