<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>crashketchum</title>
<meta name="description" content="crashketchum: Pokémon-Karten live auf Whatnot. Hier findest du den Stream und alle Kanäle.">
<meta name="theme-color" content="#c41e2e">
<script>
/* Alte Links auf die Steuerseite (#wheel, #obs, #buehne) weiterleiten, z. B. aus dem Lesezeichen „Wheel-Leser“ */
if (/^#(wheel|obs|buehne|fang)/.test(location.hash)) location.replace('steuerung/' + location.search + location.hash);
</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Lilita+One&family=Nunito:wght@600;800&display=swap" rel="stylesheet">
<style>
:root {
  color-scheme: light;
  --red: #e0303f;
  --red-dark: #a3182a;
  --ink: #15151d;
  --white: #fbfbfd;
  --gold: #ffd85e;
  --display: 'Lilita One', 'Arial Black', Impact, system-ui, sans-serif;
}
* { box-sizing: border-box; }
html, body { margin: 0; }
body {
  min-height: 100vh; color: #fff; font: 600 16px/1.45 'Nunito', system-ui, sans-serif;
  background: radial-gradient(circle at 50% -10%, #ff5a66 0%, transparent 55%), linear-gradient(180deg, #e0303f 0%, #b81f30 60%, #8f1424 100%) fixed;
  background-color: #b81f30;
  display: flex; flex-direction: column;
}
a { color: inherit; }
.wrap { width: 100%; max-width: 520px; margin: 0 auto; padding: 0 16px; flex: 1; display: flex; flex-direction: column; }

/* Kopf: Pokéball, Name */
.hero { text-align: center; padding: 56px 0 28px; }
.ball { width: 112px; height: 112px; display: block; margin: 0 auto 18px; filter: drop-shadow(0 8px 0 rgba(0,0,0,.18)); animation: wob 3.6s ease-in-out infinite; transform-origin: 50% 90%; }
@keyframes wob { 0%, 70%, 100% { transform: rotate(0); } 76% { transform: rotate(-14deg); } 84% { transform: rotate(10deg); } 90% { transform: rotate(-4deg); } }
h1 { margin: 0; font-family: var(--display); font-weight: 400; font-size: clamp(40px, 11vw, 58px); line-height: 1; letter-spacing: .5px; color: #fff; text-shadow: 0 4px 0 var(--red-dark); }
h1 span { color: var(--gold); }
.tag { margin: 12px 0 0; font-size: 17px; opacity: .9; }

/* Hauptknopf Whatnot */
.main { display: flex; align-items: center; gap: 16px; padding: 18px 20px; border-radius: 22px; text-decoration: none; background: var(--white); color: var(--ink); box-shadow: 0 6px 0 rgba(0,0,0,.2); transition: transform .12s, box-shadow .12s; }
.main:hover { transform: translateY(-2px); box-shadow: 0 8px 0 rgba(0,0,0,.2); }
.main:active { transform: translateY(3px); box-shadow: 0 3px 0 rgba(0,0,0,.2); }
.main .ic { width: 56px; height: 56px; border-radius: 16px; background: #ffde00; color: var(--ink); display: grid; place-items: center; flex: none; }
.main .ic svg { width: 32px; height: 32px; }
.main div { flex: 1; min-width: 0; }
.main b { display: block; font-family: var(--display); font-weight: 400; font-size: 23px; line-height: 1.1; letter-spacing: .3px; }
.main small { display: block; color: #5b5b6b; font-size: 14px; }
.main .go { width: 40px; height: 40px; border-radius: 50%; background: var(--red); color: #fff; display: grid; place-items: center; flex: none; }
.main .go svg { width: 18px; height: 18px; }

/* Socials */
.socials { display: grid; gap: 10px; margin-top: 14px; }
.social { display: flex; align-items: center; gap: 14px; padding: 12px 16px; border-radius: 18px; text-decoration: none; background: rgba(255,255,255,.12); border: 2px solid rgba(255,255,255,.22); transition: background .15s, transform .12s; }
.social:hover { background: rgba(255,255,255,.2); transform: translateY(-1px); }
.social .ic { width: 40px; height: 40px; border-radius: 12px; display: grid; place-items: center; background: #fff; color: var(--ink); flex: none; }
.social .ic svg { width: 22px; height: 22px; }
.social b { display: block; font-size: 16px; }
.social div span { display: block; font-size: 13px; opacity: .8; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.social > div { min-width: 0; }

footer { margin-top: auto; padding: 40px 0 24px; text-align: center; font-size: 13px; opacity: .75; }
footer a { text-decoration: none; margin: 0 6px; display: inline-flex; align-items: center; gap: 4px; }
footer a:hover { text-decoration: underline; }
footer svg { width: 11px; height: 11px; }

@media (prefers-reduced-motion: reduce) { * { animation: none !important; transition: none !important; } }
</style>
</head>
<body>
<div class="wrap">
  <header class="hero">
    <svg class="ball" viewBox="0 0 100 100" aria-hidden="true">
      <circle cx="50" cy="50" r="45" fill="#fbfbfd"/>
      <path d="M5 50a45 45 0 0 1 90 0z" fill="#e0303f"/>
      <path d="M20 31a32 32 0 0 1 20-14" stroke="#fff" stroke-opacity=".6" stroke-width="6" fill="none" stroke-linecap="round"/>
      <path d="M5 50h90" stroke="#15151d" stroke-width="8"/>
      <circle cx="50" cy="50" r="45" fill="none" stroke="#15151d" stroke-width="6"/>
      <circle cx="50" cy="50" r="14" fill="#fbfbfd" stroke="#15151d" stroke-width="6"/>
      <circle cx="50" cy="50" r="6" fill="#fff" stroke="#15151d" stroke-opacity=".25" stroke-width="2"/>
    </svg>
    <h1>crash<span>ketchum</span></h1>
    <p class="tag">Pokémon-Karten live auf Whatnot</p>
  </header>

  <main>
    <a class="main" id="main" href="#" target="_blank" rel="noopener">
      <span class="ic"><svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M2 6h3.2l2.3 8.2L10 6h4l2.5 8.2L18.8 6H22l-4 12h-3.3L12 9.6 9.3 18H6z"/></svg></span>
      <div><b>Zum Livestream</b><small>auf Whatnot folgen und keinen Stream verpassen</small></div>
      <span class="go"><svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M8 5.5v13a1 1 0 0 0 1.5.86l10.5-6.5a1 1 0 0 0 0-1.72L9.5 4.64A1 1 0 0 0 8 5.5z"/></svg></span>
    </a>
    <nav class="socials" id="socials" aria-label="Socials"></nav>
  </main>

  <footer>
    <a href="steuerung/" title="Nur mit Code"><svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M12 2a5 5 0 0 0-5 5v3H6a2 2 0 0 0-2 2v8a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-8a2 2 0 0 0-2-2h-1V7a5 5 0 0 0-5-5zm-3 8V7a3 3 0 0 1 6 0v3z"/></svg>Fangen</a>
    <a href="steuerung/#wheel" title="Nur mit Code"><svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M12 2a5 5 0 0 0-5 5v3H6a2 2 0 0 0-2 2v8a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-8a2 2 0 0 0-2-2h-1V7a5 5 0 0 0-5-5zm-3 8V7a3 3 0 0 1 6 0v3z"/></svg>Wheel</a>
  </footer>
</div>

<script>
/* ---------- Hier die Links eintragen. Einträge ohne url werden nicht angezeigt. ---------- */
const WHATNOT = 'https://www.whatnot.com/user/crashketchum';
const SOCIALS = [
  { name: 'Instagram', handle: '', url: '', icon: 'instagram' },
  { name: 'TikTok', handle: '', url: '', icon: 'tiktok' },
  { name: 'YouTube', handle: '', url: '', icon: 'youtube' },
  { name: 'Twitch', handle: '', url: '', icon: 'twitch' },
  { name: 'Discord', handle: '', url: '', icon: 'discord' },
  { name: 'X', handle: '', url: '', icon: 'x' },
  { name: 'Facebook', handle: '', url: '', icon: 'facebook' }
];

const ICONS = {
  instagram: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><rect x="3" y="3" width="18" height="18" rx="5"/><circle cx="12" cy="12" r="4.2"/><circle cx="17.4" cy="6.6" r="1" fill="currentColor" stroke="none"/></svg>',
  tiktok: '<svg viewBox="0 0 24 24" fill="currentColor"><path d="M16.5 3c.4 2.3 1.9 3.8 4.2 4v3.1c-1.6 0-3-.5-4.2-1.3v6.4A5.8 5.8 0 1 1 10.7 9.4v3.2a2.7 2.7 0 1 0 2.6 2.7V3z"/></svg>',
  youtube: '<svg viewBox="0 0 24 24" fill="currentColor"><path d="M22 8.2c-.2-1.6-1-2.7-2.6-2.9C17 5 12 5 12 5s-5 0-7.4.3C3 5.5 2.2 6.6 2 8.2 1.8 9.5 1.8 12 1.8 12s0 2.5.2 3.8c.2 1.6 1 2.7 2.6 2.9C7 19 12 19 12 19s5 0 7.4-.3c1.6-.2 2.4-1.3 2.6-2.9.2-1.3.2-3.8.2-3.8s0-2.5-.2-3.8zM10 15.2V8.8l5.5 3.2z"/></svg>',
  twitch: '<svg viewBox="0 0 24 24" fill="currentColor"><path d="M4.3 2 3 5.5V20h4.8v2.5h2.7l2.5-2.5h3.9l5.1-5.1V2zm15 11.8-3 3h-4.8l-2.5 2.5v-2.5H5V3.8h14.3zM16.4 7v5.3h-1.8V7zm-4.8 0v5.3H9.8V7z"/></svg>',
  discord: '<svg viewBox="0 0 24 24" fill="currentColor"><path d="M19.3 5.3A17 17 0 0 0 15 4l-.5 1.1a15.6 15.6 0 0 0-5 0L9 4a17 17 0 0 0-4.3 1.3C2 9.4 1.3 13.3 1.6 17.2A17 17 0 0 0 6.9 20l1.1-1.8c-.6-.2-1.2-.5-1.7-.9l.4-.3a12 12 0 0 0 10.6 0l.4.3c-.5.4-1.1.7-1.7.9l1.1 1.8a17 17 0 0 0 5.3-2.8c.4-4.5-.7-8.4-3.1-11.9zM8.7 14.8c-1 0-1.9-1-1.9-2.2s.8-2.2 1.9-2.2 1.9 1 1.9 2.2-.8 2.2-1.9 2.2zm6.6 0c-1 0-1.9-1-1.9-2.2s.8-2.2 1.9-2.2 1.9 1 1.9 2.2-.8 2.2-1.9 2.2z"/></svg>',
  x: '<svg viewBox="0 0 24 24" fill="currentColor"><path d="M17.8 3h3.1l-6.8 7.8L22 21h-6.2l-4.9-6.4L5.3 21H2.2l7.3-8.3L2 3h6.4l4.4 5.8zm-1.1 16.2h1.7L7.4 4.7H5.6z"/></svg>',
  facebook: '<svg viewBox="0 0 24 24" fill="currentColor"><path d="M13.5 22v-8h2.7l.4-3.2h-3.1V8.8c0-.9.3-1.5 1.6-1.5h1.7V4.4c-.3 0-1.3-.1-2.5-.1-2.4 0-4.1 1.5-4.1 4.2v2.3H7.5V14h2.7v8z"/></svg>',
  link: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M10 14a4.5 4.5 0 0 0 6.4 0l3-3a4.5 4.5 0 0 0-6.4-6.4l-1 1"/><path d="M14 10a4.5 4.5 0 0 0-6.4 0l-3 3a4.5 4.5 0 0 0 6.4 6.4l1-1"/></svg>'
};
const esc = (s) => String(s).replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
document.getElementById('main').href = WHATNOT;
document.getElementById('socials').innerHTML = SOCIALS.filter((s) => s.url).map((s) =>
  `<a class="social" href="${esc(s.url)}" target="_blank" rel="noopener">
    <span class="ic">${ICONS[s.icon] || ICONS.link}</span>
    <div><b>${esc(s.name)}</b><span>${esc(s.handle || s.url.replace(/^https?:\/\/(www\.)?/, ''))}</span></div>
  </a>`).join('');
</script>
</body>
</html>
